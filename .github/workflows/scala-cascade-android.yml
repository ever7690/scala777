name: SCALA CASCADE Android APK
on:
  push:
    branches: [scala-cascade-android]
    paths:
      - "SCALA_CASCADE/**"
      - ".github/workflows/scala-cascade-android.yml"
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Preparar Godot 4.3 y export templates
        run: |
          set -eux
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/godot/
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ] && [ ! -d ~/.local/share/godot/export_templates/4.3.stable ]; then
            mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          fi
          if [ -d /root/.config/godot ] && [ ! -d ~/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<'SETTINGS'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          godot --headless --version
          java -version
      - name: Importar y validar GDScript
        run: |
          set -eu
          godot --headless --editor --path SCALA_CASCADE --import --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:.*(script|load|parse)' import.log; then
            echo "ERROR: Godot informó errores de importación o scripts"
            exit 1
          fi
      - name: Ejecutar prueba real de arranque del juego
        run: |
          set -eu
          godot --headless --path SCALA_CASCADE --quit-after 30 2>&1 | tee runtime.log
          if grep -E 'SCRIPT ERROR|Invalid call|Invalid access|Parse Error' runtime.log; then
            echo "ERROR: Falló el arranque del juego"
            exit 1
          fi
      - name: Preparar firma de depuración
        run: |
          set -eu
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=SCALA Games,C=BO"
          fi
      - name: Exportar APK Android
        run: |
          set -eu
          mkdir -p SCALA_CASCADE/build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --path SCALA_CASCADE --export-debug Android build/SCALA_CASCADE_DEBUG.apk 2>&1 | tee export.log
          test -s SCALA_CASCADE/build/SCALA_CASCADE_DEBUG.apk
      - name: Comprobar integridad del instalador
        run: |
          set -eu
          APK="SCALA_CASCADE/build/SCALA_CASCADE_DEBUG.apk"
          test -s "$APK"
          unzip -t -q "$APK"
          unzip -Z1 "$APK" | grep -q '^AndroidManifest.xml$'
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libgodot_android.so$'
          unzip -Z1 "$APK" | grep -q '^assets/'
          echo "APK Android presente, contenido válido, motor ARM64 y recursos verificados"
      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: SCALA_CASCADE_ANDROID_DEBUG
          path: SCALA_CASCADE/build/SCALA_CASCADE_DEBUG.apk
          if-no-files-found: error
